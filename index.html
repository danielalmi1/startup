<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartoonify</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!-- Banner -->
    <div class="banner">
      <div class="container">
        <h1>Turn your travels into funny cartoons</h1>
        <h2>Our AI tool generates a cartoon-style image of your own travel pictures</h2>
        <a href="#waitlist" class="btn-primary">Join the waitlist</a>
      </div>
    </div>

    <!-- Steps -->
    <div class="container">
      <div class="cards">

        <div class="card">
          <img src="images/cover-lofoten.jpg" alt="Upload a picture">
          <h3>Step 1</h3>
          <p>Upload one of your travel pictures</p>
        </div>

        <div class="card">
          <img src="images/cover-meghalaya.jpg" alt="Choose a style">
          <h3>Step 2</h3>
          <p>Choose a cartoon style you prefer</p>
        </div>

        <div class="card">
          <img src="images/cover-oaxaca.jpg" alt="Download your cartoon">
          <h3>Step 3</h3>
          <p>Download and enjoy your creation!</p>
        </div>

      </div>

      <div data-tf-live="01KTW3XCW0JVV5CQ1MDJ39TSWX"></div><script src="//embed.typeform.com/next/embed.js"></script>

    </div>

  </body>
</html>
